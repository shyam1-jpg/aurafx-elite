# Render.com — deploy AuraFX website (aurafxelite.com)
# Dashboard: New Blueprint or Web Service → connect repo, root: website

services:
  - type: web
    name: aurafx-elite
    runtime: node
    rootDir: website
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    envVars:
      - key: SITE_URL
        value: https://aurafxelite.com
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      - key: INSTITUTIONAL_MODE
        value: demo
      - key: EMAIL_AUTO_WELCOME
        value: "0"
      - key: SITE_MODE
        value: testing
      - key: QUOTES_UPSTREAM_MS
        value: "5000"
      - key: CLIENT_POLL_SEC
        value: "1"
      - key: AURAFX_OWNER_KEY
        generateValue: true
      - key: AI_DEMO_URL
        value: https://aura-fx-elite-ai.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini
  - type: web
    name: aura-fx-elite-ai
    runtime: node
    plan: free
    rootDir: aura-fx-elite-ai
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/signals
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_DEMO_KEY
        generateValue: true
